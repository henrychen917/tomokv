# EPYC 9754 stretch test: 64 server cores = CCDs 0-7, nodes map to CCDs
tomokv-nodes 8
# pin-mode ccd counts SMT siblings as cores on this box (packs 8 nodes onto 4
# physical CCDs) -- static spec pins each node to its own CCD's physical cores.
tomokv-pin-mode static
tomokv-pin-ex "node0=0-3 node1=8-11 node2=16-19 node3=24-27 node4=32-35 node5=40-43 node6=48-51 node7=56-59"
tomokv-pin-io "node0=4-7 node1=12-15 node2=20-23 node3=28-31 node4=36-39 node5=44-47 node6=52-55 node7=60-63"
tomokv-thread-mode static
tomokv-thread-io 4
tomokv-thread-ex 4

port 6379
bind 127.0.0.1
protected-mode no
save ""
appendonly no
enable-debug-command yes
