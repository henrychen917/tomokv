# ============================================================================
# tomokv.conf -- TomoKV / THredis configuration reference
#
# Generated from src/config.c (the single source of truth), then VERIFIED by
# booting with it and diffing every knob against a boot with no conf at all.
#
# WHY THIS FILE EXISTS
# --------------------
# Config mistakes here do not fail loudly by default -- they produce a server
# that boots and a benchmark that lies. Two examples that each cost real
# debugging time:
#
#   * `--tomokv-thread-modes 1` -- booleans take `yes`/`no`, not `1`/`0`, so the
#     server REFUSED TO BOOT, the harness dutifully recorded "flips=0, ops=0",
#     and that was very nearly reported as "the flip controller does not
#     actuate" when the controller was fine and the CONFIG LINE was wrong.
#   * setting only ONE of the two knobs the flip controller required. It needed
#     BOTH tomokv-thread-modes AND tomokv-thread-balance; with only one it
#     silently returned and never actuated.
#
# BOTH of those knobs are GONE (2026-07-27). The split policy is now ONE named
# enum -- `tomokv-thread-mode auto|static` -- so the half-configured state is
# unrepresentable, and a wrong value is rejected with the valid values listed:
#
#     $ redis-server --tomokv-thread-mode 1
#     >>> 'tomokv-thread-mode "1"'
#     argument(s) must be one of the following: auto, static
#
# MANDATORY -- THE SERVER WILL NOT BOOT WITHOUT A THREAD POOL
# -----------------------------------------------------------
# There is no default; omitting these is a FATAL at startup:
#
#     tomokv-thread-io  I      # ingress threads PER NODE
#     tomokv-thread-ex  E      # workers PER NODE
#
# With `tomokv-nodes 1` (the default) they are simply the TOTAL thread counts --
# that is exactly what the removed flat `tomokv-io-threads`/`tomokv-ex-threads`
# used to mean. Example (the configuration this project benchmarks):
#
#     tomokv-nodes 1
#     tomokv-thread-io 4
#     tomokv-thread-ex 4
#
# WHAT A "NODE" IS
# ----------------
# `tomokv-nodes` is a CCD count OR a NUMA-node count -- `tomokv-pin-mode`
# decides which (`ccd` => CCDs / shared-L3 domains, `numa` => NUMA nodes).
# Which partitioning is better for the target hardware is NOT yet known; it is
# a measurement to run on the EPYC/Threadripper box, which is why it is one
# knob and not a compile-time assumption.
#
# THREAD-IO / THREAD-EX ARE THE *STARTING* SPLIT IN BOTH MODES
# ------------------------------------------------------------
# Under `tomokv-thread-mode auto` the flip controller may move away from it;
# under `static` it is held for the whole run. The starting point matters for
# measurement reproducibility: a benchmark that starts at a different split
# spends its window converging instead of measuring.
# Measured (p1, -d 32, settled): ~821k ops/s auto vs ~833k static io7/ex1.
#
# KNOBS THAT REFUSE TO BE SILENTLY IGNORED
# -----------------------------------------
# Every remaining "must be set together" pair is now a boot FATAL, not a silent
# no-op:
#   * tomokv-pin-io / tomokv-pin-ex with any pin-mode other than `static`
#   * tomokv-pin-mode static without both specs (or with too few cpus for the pool)
#
# IMMUTABLE = boot-time only; CONFIG SET will not change it at runtime.
#
# "Off" is not a state those can have, so 0 means auto for them; each one says so
# in src/config.c.
#
# Lines below are COMMENTED and show the compiled default. Uncomment to override.
# ============================================================================


# --- TOPOLOGY  --  total real cores = nodes x cores-per-node ---------------
# tomokv-nodes  [integer]  (IMMUTABLE)
# tomokv-nodes 1
# tomokv-cores-per-node  [integer]  (IMMUTABLE)
# tomokv-cores-per-node 0

# --- FRONT/BACK SPLIT  --  the starting io/ex split, PER NODE, in BOTH modes ---
# tomokv-thread-mode  [auto|static]  (IMMUTABLE)
# tomokv-thread-mode auto
# tomokv-thread-io  [integer]  (IMMUTABLE)   # NO DEFAULT -- see MANDATORY above; 0 here means "unset"
# tomokv-thread-io 0
# tomokv-thread-ex  [integer]  (IMMUTABLE)   # NO DEFAULT -- see MANDATORY above; 0 here means "unset"
# tomokv-thread-ex 0

# --- PINNING  --  pin-io/pin-ex are used ONLY with pin-mode static ---------
# tomokv-pin-mode  [float|ccd|numa|static]  (IMMUTABLE)
# tomokv-pin-mode ccd
# tomokv-pin-io  [string]  (IMMUTABLE)
# tomokv-pin-io ""
# tomokv-pin-ex  [string]  (IMMUTABLE)
# tomokv-pin-ex ""




# tomokv-strict-order  [integer]
# tomokv-strict-order 0




# ============================================================================
# LATENCY / BATCHING AUTOTUNERS
# ----------------------------------------------------------------------------
# All six follow the project knob convention: -1 = auto (self-tuning, needs no
# hardware knowledge), 0 = off (and off means NO machinery runs, not "run it and
# discard the result"), N = pinned static value. You should not need to set any
# of them; they are here so a sweep can pin one and remove it as a variable.
#
# The auto arms are feedback loops, so pinning one is also the way to test
# whether its controller is the thing helping or hurting.







# ============================================================================
# RETIRED KNOBS (2026-07-28)
# ----------------------------------------------------------------------------
# 44 tomokv knobs were retired; the surface went 55 -> 11. Each was hardwired to
# exactly its previous DEFAULT, so behaviour is unchanged.
#
# They are ACCEPTED-AND-IGNORED, not deleted, because the boot parser FATALs on an
# unknown directive and several were IMMUTABLE knobs whose value was resolved at
# boot and written back into the config-backed field -- so any server that ever ran
# CONFIG REWRITE has an explicit line for them on disk. An old config still boots;
# CONFIG GET/SET no longer see them.
#
# Why they went: most were dead or fictional. tomokv-ex-queue-depth's "auto" could
# only ever produce 2048 (its floor equalled its maximum, so the widen loop could
# not execute). tomokv-worker-pop-batch documented a "PID-style grow/decay" that
# never existed. tomokv-drain-tail-skip advertised -1/1=auto where both are the same
# branch. The rest were measured winners with no reason to flip, or values derived
# from hardware (L3 topology) that an operator should not be guessing at.
#
# The manual thread-mode actuator moved to DEBUG TOMO-MODESHIFT <mode>, where a test
# hook belongs -- it is gated by enable-debug-command and has no steady-state
# behaviour to tune.

# ============================================================================
# LOAD BALANCING — three separate levers, deliberately not one
# ----------------------------------------------------------------------------
# These are different decisions and were briefly collapsed into each other:
#   key-lb          moves BUCKETS between workers (data placement)
#   client-lb       moves CONNECTIONS between io threads, continuously
#   flip-rebalance  moves CONNECTIONS once, when a flip creates a new io thread
# Standing rule: always-on LB machinery must cost <= 3% throughput or it does not
# ship, so each lever is separately switchable and separately measurable.

# Bucket/key balancer. 0 = off, N = min ops/s before a shard is a candidate.
# tomokv-key-lb 20000

# How many CONSECUTIVE 1 Hz ticks the hot shard must be a statistical outlier
# before a migration fires. -1 = auto (one EWMA time constant, floored at 3),
# 0 = no debounce (the pre-2026-07-28 trigger, kept as the A/B arm), N = ticks.
# tomokv-key-lb-sustain -1

# Resolution of the load profile the hot-KEY veto decides on. The always-on
# signal counts ops per 64-bucket GROUP, which cannot tell a hot key (ONE bucket)
# from 64 mildly-warm buckets -- so the veto could never fire and a wasted
# migration was stopped one step later by the no-progress guard instead. This
# arms a 64-counter per-BUCKET window on the hottest group of each worker, only
# while that group is genuinely concentrated. Full per-bucket counters would be
# 64KB/worker of always-on working set, which does not fit the 3% budget above.
#   -1 = auto: arm at max(4x the uniform per-group share, 5% of the shard's rate)
#    0 = off: nothing allocated, windows disarmed, planner back to group
#             resolution. Also the A/B arm for the budget and for showing that a
#             refusal actually came from the finer level (DEBUG RESHARD TRIGGER
#             unbal_fine counts only refusals group resolution would NOT reach).
#    N = arm when the top group holds >= N% of the shard's rate
# tomokv-key-lb-fine -1

# Continuous connection balancer: moves conns off a SUSTAINED busy-outlier io
# thread, within a node, to a tolerance band (not chasing every blip).
# tomokv-client-lb yes

# One-shot: on grow-front, pull existing conns onto the newly created io thread.
# tomokv-flip-rebalance yes

# ============================================================================
# PIPELINE DEPTH — also the per-client fake-client (fc) ring cap
# ----------------------------------------------------------------------------
# One knob bounds BOTH in-flight commands per connection AND per-client ring
# memory: the fc ring is allocated at min(want, pipeline-depth) and may only grow
# while ring_size < pipeline-depth. -1 = auto (max 32, decays toward measured
# demand), 0 = off (depth 1), N = static (rounded up to a power of two).
# tomokv-pipeline-depth -1

# Forward values >= N bytes zero-copy. Measured +20-24% at 16-64KB. 0 = never.
# tomokv-zerocopy-min-value 1024

# Cross-shard MSET: hand the value object to the owning worker (argv_released_mask
# ownership handoff) instead of giving the sub a private copy. DEFAULT OFF and it
# stays off -- no gain has ever been measured OR CLAIMED for it. It is here as an
# experiment lever for the regime where the copy could matter (large values,
# cross-NUMA), which this box cannot answer. Enabling it is an ownership change,
# not a tuning parameter: see csAppendMsetValue for the contract.
# tomokv-mset-move no

# Epoch-versioned atomic MSET/MGET visibility. The admission window applies only
# while this is enabled; window 0 leaves the atomic path's admission unlimited.
# tomokv-atomic no
# tomokv-atomic-window 512

# ============================================================================
# CROSS-L3 LATENCY MEASUREMENT RIG — DEBUG/isolated instances only
# ----------------------------------------------------------------------------
# Adds this many nanoseconds at each producer-side coherence publication in
# DEBUG TOMO-SIM-HOP: IO->EX ring visibility, then EX->IO CDB visibility.
# 0 is completely off: no TSC calibration, heap allocation, or production
# hot-path test. Non-zero requires invariant TSC + RDTSCP and is immutable.
#
# Start an isolated server with thread-mode static, key-lb 0 and DEBUG enabled,
# then run `redis-cli DEBUG TOMO-SIM-HOP 30000` for a 30-second wall interval.
# Sweep 0,50,100,200,400 while attaching perf stat to the server externally.
# tomokv-sim-hop-ns 0
