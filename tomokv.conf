# ============================================================================
# tomokv.conf -- TomoKV / THredis configuration reference
#
# Generated from src/config.c (the single source of truth), then VERIFIED by
# booting with it and diffing every knob against a boot with no conf at all.
#
# WHY THIS FILE EXISTS
# --------------------
# Boolean knobs take `yes` / `no`, NOT `1` / `0`. Writing `1` gives
#     argument must be 'yes' or 'no'
# and the server REFUSES TO BOOT. That has already cost real debugging time: a
# flip-controller probe was written with `--tomokv-thread-modes 1`, the server
# never started, the harness dutifully recorded "flips=0", and that was very
# nearly reported as "the flip controller does not actuate" -- when the
# controller was fine and the CONFIG LINE was wrong.
#
# MANDATORY -- THE SERVER WILL NOT BOOT WITHOUT A THREAD POOL
# -----------------------------------------------------------
# You must pick ONE of these two forms. There is no default; omitting both is a
# FATAL at startup ("set the thread pool explicitly"):
#
#   node model  :  tomokv-numa-nodes N  +  tomokv-io-per-node I  +  tomokv-ex-per-node E
#   legacy flat :  tomokv-io-threads I  +  tomokv-ex-threads E
#
# Example (the configuration this project benchmarks):
#   tomokv-numa-nodes 1
#   tomokv-io-per-node 4
#   tomokv-ex-per-node 4
#
# TWO KNOBS THAT MUST BE SET TOGETHER
# -----------------------------------
# The flip controller's first statement is
#     if (!server.thread_balance || !server.thread_modes || !server.exThreads) return;
# so it needs BOTH tomokv-thread-modes AND tomokv-thread-balance. Setting only
# one silently disables the entire feature with no warning, and
# tomokv-thread-balance additionally auto-disables itself at boot when
# tomokv-thread-modes is off. Both default to yes.
# Measured when it actuates (p1, -d 32): 595,626 -> 786,956 ops/s (+32%).
#
# IMMUTABLE = boot-time only; CONFIG SET will not change it at runtime.
#
# NUMERIC CONVENTION (project-wide)
#   -1  auto / self-tuning (derived from measured state -- no hardware knowledge needed)
#    0  feature OFF (and, where it matters, no allocation is made)
#    N  explicit static value, overriding auto
#
# Lines below are COMMENTED and show the compiled default. Uncomment to override.
# ============================================================================

# --- THREAD MODEL / LOAD BALANCING -------------------------------------
# tomokv-cores-per-node  [integer] (IMMUTABLE)
# tomokv-cores-per-node 0
# tomokv-ex-per-node  [integer] (IMMUTABLE)   # NO DEFAULT -- see MANDATORY above; 0/-1 here means "unset"
# tomokv-ex-per-node 0
# tomokv-ex-threads  [integer] (IMMUTABLE)   # NO DEFAULT -- see MANDATORY above; 0/-1 here means "unset"
# tomokv-ex-threads -1
# tomokv-io-per-node  [integer] (IMMUTABLE)   # NO DEFAULT -- see MANDATORY above; 0/-1 here means "unset"
# tomokv-io-per-node 0
# tomokv-io-threads  [integer] (IMMUTABLE)   # NO DEFAULT -- see MANDATORY above; 0/-1 here means "unset"
# tomokv-io-threads -1
# tomokv-modeshift-test  [integer]
# tomokv-modeshift-test 0
# tomokv-numa-nodes  [integer] (IMMUTABLE)
# tomokv-numa-nodes 1
# tomokv-thread-balance  [yes|no]
# tomokv-thread-balance yes
# tomokv-thread-modes  [yes|no] (IMMUTABLE)
# tomokv-thread-modes yes

