# tomokv.conf — annotated reference for every runtime knob (defaults shown, all lines commented,
# so loading this file unchanged boots identically to a flagless ./build/tomokv).
#
# Usage:    ./build/tomokv tomokv.conf            (redis-style bare path)
#           ./build/tomokv --conf tomokv.conf --port 7000    (CLI flags override the file)
# Grammar:  `name value` per line, # comments. Names are the CLI flags without the leading `--`.
# Source of truth: src/core/config.h (struct Config + the one parser both the CLI and this file
# go through). Knobs marked [live] can also be changed at runtime via CONFIG SET.
#
# Compile-time tunables are deliberately NOT here (changing them is a rebuild + re-validation):
# kRobWindow=64 (net/conn.h), kEmbedThreshold=192 (store/kvobj.h), ValueSlot::kInline=1024
# (cmd/scatter_engine.inc) and kCommonBytes=16KiB (cmd/xshard.h).

########################## NETWORK ##########################

# TCP listen port and address.
# port 6379
# bind 127.0.0.1

# Independent TLS listener; tls-port 0 disables TLS and allocates no TLS state. Plain `port` and
# `tls-port` may coexist; `port 0` + a non-zero tls-port makes the service TLS-only. TLS requires a
# PEM certificate chain and private key. Client authentication defaults to yes (a trusted client
# certificate is mandatory); optional requests and verifies a certificate when supplied; no does
# not request one. A CA file or c_rehash-prepared CA directory is required for yes/optional.
# tls-port 0
# tls-cert-file /etc/tomokv/server.crt
# tls-key-file /etc/tomokv/server.key
# tls-ca-cert-file /etc/tomokv/ca.crt
# tls-ca-cert-dir /etc/tomokv/ca
# tls-auth-clients yes

# Space-separated, case-insensitive protocol names: TLSv1 TLSv1.1 TLSv1.2 TLSv1.3. Empty selects
# TLSv1.2 + TLSv1.3. tls-ciphers controls TLS <=1.2; tls-ciphersuites controls TLS 1.3. The
# defaults below are the AES-128-GCM-first lists src/net/tls.cc installs when the knob is empty
# (kernel/AES-NI-fast, kTLS-eligible); an explicit value replaces the default list exactly.
# tls-protocols "TLSv1.2 TLSv1.3"
# tls-ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256
# tls-ciphersuites TLS_AES_128_GCM_SHA256
# tls-prefer-server-ciphers no

# TomoKV attempts kernel TLS in both directions by default. Unsupported kernels/ciphers fall back
# silently to userspace TLS per connection; `no` forces the userspace path. Explicit tls-ciphers
# and tls-ciphersuites values take precedence over the AES-128-GCM-first defaults.
# tls-ktls yes

# Also listen on a unix domain socket (unset = off).
# unixsocket /tmp/tomokv.sock

###################### CONNECTION LIMITS ###################

# Maximum accepted clients [live], default 10000. Admission is checked before Client allocation.
# With independent SO_REUSEPORT acceptors, a simultaneous burst may overshoot by at most the
# number of IO threads; this is a safety valve rather than an exact reservation boundary.
# maxclients 10000

# Close idle normal clients after strictly more than this many whole seconds [live]. 0 disables.
# Blocked and RESP2 pub/sub clients are exempt; an idle MULTI transaction is not exempt.
# timeout 0

# TCP keepalive interval in seconds [live for newly accepted connections]. 0 makes no keepalive
# setsockopt calls. Linux KEEPINTVL is interval/3 (minimum 1) and KEEPCNT is 3.
# tcp-keepalive 300

# listen(2) backlog for TCP and unix sockets [boot-only]. Linux may cap it at somaxconn; boot logs
# Redis's advisory warning when that happens.
# tcp-backlog 511

# Network event engine for the io threads [boot-only]. Spelled like persist-io because it is the
# same kind of decision: which kernel interface carries our IO.
#   uring  the native path and the default. One io_uring per io thread with SINGLE_ISSUER +
#          DEFER_TASKRUN; accept/recv/send are submitted and complete asynchronously.
#   epoll  a portable alternative for kernels and environments where io_uring is unavailable or
#          unwanted. The io thread waits in epoll_wait and issues recv/send/accept itself. The
#          2-stage split, routing, shard ownership and the reply path are identical; only the
#          waiting and completion change.
# Selecting epoll changes two other things, and the boot log says so:
#   - persist-io is forced to normal (the uring persistence engine submits its writes and fsyncs
#     as SQEs on an io thread's ring, and under epoll no ring exists).
#   - no io_uring syscall is made anywhere in the process, including by the executor threads,
#     whose cross-thread doorbell becomes an eventfd mailbox.
# TLS (tls-port), kTLS and the zero-copy borrowed-value send path all work under either engine.
# INDICATIVE loopback throughput on a shared box: epoll costs a few percent at p32 and roughly a
# fifth at p1 -- see NOTES-EPOLL.md. Prefer uring wherever it is available.
# net-io uring

# Per-client staged reply limits [live]. Each clause is CLASS HARD SOFT SOFT-SECONDS; memory
# suffixes follow Redis (k/m/g are decimal, kb/mb/gb are binary). Clauses on repeated lines merge.
# normal and pubsub are enforced; slave/replica parses, stores, and round-trips as slave but is
# inert because TomoKV has no replication connection class. Hard triggers at >= immediately. Soft
# triggers only after a continuous interval strictly greater than SOFT-SECONDS; 0 disables each
# threshold independently. Unlike Redis's fixed reply buffer, TomoKV's growable fill/send buffers
# are counted, as are zero-copy Borrow segments, because both retain pending-output memory.
# client-output-buffer-limit normal 0 0 0
# client-output-buffer-limit replica 256mb 64mb 60
# client-output-buffer-limit pubsub 32mb 8mb 60

######################### PLACEMENT #########################
# Thread architecture [boot-only]. `2s` is the default and keeps separate IO and executor threads;
# `1s` gives every selected physical thread both responsibilities. The old spellings `split` and
# `fused` remain accepted aliases. `overlap` selects the fixed amortization schedule:
#
#                              overlap
#                   0                  1                         2
#   thread-mode 2s  plain split loops  iopipe WB/IFID batches   rejected
#   thread-mode 1s  coarse rotation    iofused interleave       gated iofused three-way
#
# Overlap 2 prints an experimental-research warning at boot. Unified overlap 1 and 2 require the
# uring net-io engine because their measured schedule has one explicit submit boundary. Mode 1s
# rejects ratio and flip-auto, and FLIP replies with a mode-unavailable error; use `place` to
# select its CPUs (ifid/ex labels select CPUs but do not divide roles). INFO and CONFIG GET report
# the booted values. The shipped `thread-pipeline` numeric spelling and `genthread-schedule`
# coarse|iofused|streams spelling remain accepted aliases; `streams` is only the legacy name for
# the overlap 2 value, not its implementation. See docs/thread-mode.md.
# thread-mode 2s
# overlap 0
# Let eligible GETs and MGETs use the parsing thread's local EX lane. Boot-only; this version arms
# the lane only for thread-mode 1s plus overlap 0, where work starts immediately after parse in the
# same coarse rotation. Every other legal cell accepts 1 but uses the ordinary owner-task path and
# logs a notice.
# See docs/thread-mode.md for the connection and store safety gates.
# read-local 0
# Capture the exact immutable object found during an armed local-read prefetch and consume that
# version at execute instead of reloading a concurrently replaced slot. Boot-only; default 1.
# Set 0 for the legacy hint-only prefetch A/B control. Inert unless read-local is active.
# read-local-prefetch-capture 1

# Per-key B+ gate for pending atomic work. Boot-only and default-on; set 0 to retain the former
# whole-shard pending refusal as an A/B control while keeping read-local enabled.
# read-local-atomic-filter 1

# Internal boot-only read-local scheduling selector. 1 (default) drains bounded local-read chunks
# before and between bounded per-producer owner-task quanta, re-notifying residual owner work; 0
# retains the original single positional drain for A/B. It is inert unless read-local is active.
# Snapshot, placement and pre-existing retry/deferred turns keep their legacy ordering.
# read-local-interleave 1

# In 2s mode, the default with no placement knob at all is an even io/ex split over every
# allowed cpu. In 1s mode every allowed cpu is selected. Confine the server with taskset —
# pinning is relative to the ALLOWED cpu set, so lanes can share a box.

# Global role counts, spread evenly over L3 domains by the server. 2s mode only. UNSET by default
# (an even io/ex split over every allowed cpu, io taking the odd one out); the value below is an
# example, not the default: on the 32c gate cells 18:14 is the p128 champion, 28:4 the p1-singles
# champion.
# ratio 18:14

# Explicit per-thread placement (mutually exclusive with ratio within one source; across
# sources — file vs CLI — the later one wins). Roles: ifid, ex.
# place ifid@0,ifid@1,ex@2,ex@3

# Operator-declared L3 topology: comma-separated per-domain cpu lists, '-' ranges, '+' glues
# disjoint ranges into one domain. Unset = self-discover from the machine.
# l3-domains 0-7,8-15

# Complete shard:executor-thread map (unset = round-robin over executors).
# shard-home 0:1,1:1,2:3

# Shard count, 1..256. Shards outnumber workers so migration stays fine-grained.
# shards 16

# SMT scheduling contract [boot-only], numeric by the tree's knob rule. 0 is the default and keeps
# the current behavior: every logical CPU is an independent placement/FLIP unit. 1 reads each
# provisioned CPU's /sys/devices/system/cpu/cpuN/topology/thread_siblings_list and makes the whole
# sibling pair one unit; incomplete pairs and pairs split across IO/EX roles are rejected at boot.
# smt-mode 0

# EX batch scheduling policy [boot-only]. 0 preserves FIFO. 1 promotes commands nearest their
# connection's ROB retirement head, then prefers the shorter static command class at equal rank.
# ex-sched 0

# Weighted bucket/client placement [boot-only]. key-lb and client-lb independently enable their
# signal collection, weighted FLIP partition and continuous mover; 0 removes that half's counters,
# EWMA/census work and allocation, and restores its count-only FLIP behavior. Both default on.
# Bucket demand samples one successfully executed key visit in N; the controller folds those
# owner-local counters into a decaying EWMA. The remaining knobs tune the shared controller. It
# fires after three ticks above the threshold, releases below 80% of it, and compares bucket bytes
# as a separate lexicographic objective rather than blending them into demand. Zero in any shared
# machinery row disables both halves completely.
# The age/delay signal (lb-age-sample-rate) stamps one task in N with an enqueue time. Its
# default is 0 (since 43cfede8b): the zero-loss-when-stable law says an idle-stable server pays
# nothing for a signal it is not using -- the flip controller arms it during a maneuver. 1024 was
# the measured cost point (-0.7..-1.2% at stable p1).
# key-lb 1
# client-lb 1
# lb-sample-rate 64
# lb-age-sample-rate 0
# lb-tick-ms 1000
# lb-imbalance-pct 25
# lb-move-cap 1
# lb-cooldown-ms 5000

# Automatic IO/EX split controller [boot-only, 2s mode only]. It ships dark. When enabled, one main-thread cron
# uses the same internal FLIP transaction as the FLIP command, deliberately overshoots a measured
# capacity-equal split, and returns with geometrically shrinking, throughput-only steps. Signal-age
# sampling is armed only during a maneuver and released at anchor. flip-auto-band is a percent;
# -1 learns twice the anchor's own quiet jitter, while 0 disables fingerprint/rate-collapse
# re-triggers (the boot maneuver still runs). The workload fingerprint the controller reads is
# SAMPLED by parse pass on each IO owner: one pass in flip-work-window is fingerprinted whole, so
# one command in N is fingerprinted at any pipeline depth and detection latency follows traffic
# rather than time; 1 fingerprints every pass, 0 removes the sampling work. The writer is armed
# only while flip-auto is 1 -- with flip-auto 0 dispatch pays one predicted branch per command and
# no store (DESIGN-flipfp.md). See DESIGN.md for the state/ownership map.
# flip-auto 0
# flip-auto-band -1
# flip-work-window 100

# SORT BY/GET dereference has no placement knob. `SORT key BY weight_* GET data_*` first snapshots
# the source on its owner, expands one concrete key per element, then gathers those keys from their
# ordinary shard owners. Source and derived reads share one snapshot and wall-clock cut; no executor
# touches another executor's store. `SORT ... STORE` sends the completed projection through the
# ordinary destination-owner path. Globless BY still suppresses ordering, globless GET returns NULL,
# and GET # returns the source element without a derived lookup. See NOTES-SORTXSHARD.md.

# Thread pinning (pin no = threads float; only for debugging placement itself).
# pin yes

########################## DATA PATH ########################

# Zero-copy cutover in bytes [live]. GET replies with value length >= zc-min are sent by
# borrow (no memcpy); below it they are copied. The SAME knob is the multi-key gather cutover:
# effective cutover there is min(zc-min, 1024). 0 disables zero-copy entirely.
# Default ON at 16384: -4.1% server cycles at d16K on the 25GbE wire; +20-24% class on
# unwalled wires per the fork's history.
# zc-min 16384

# Key hash: mix64 (seeded, default) | siphash (hostile-key hardening, ~2% slower point ops).
# hash mix64

########################### CACHE ###########################

# Memory ceiling in bytes [live]. Boot/config-file and CONFIG SET share Redis's suffix grammar:
# bare b/bytes, decimal k/m/g, binary kb/mb/gb, all case-insensitive. Surrounding whitespace,
# signs and unsupported suffixes are rejected. 0 = unlimited and removes all eviction-path work.
# maxmemory 0

# Policy when maxmemory is reached [live]: noeviction | allkeys-lru | allkeys-lfu |
# allkeys-random | volatile-lru | volatile-lfu | volatile-random | volatile-ttl.
# For real cache duty allkeys-lfu is the recommended default (discriminates with no clock).
# maxmemory-policy noeviction

# Eviction sampling width, 1..64 [live]. Bigger = closer to true LRU/LFU, more work per eviction.
# maxmemory-samples 5

# LRU clock bucket = (1 << N) seconds, N in 0..16. Default 8 = 256s buckets, ~2h16m window
# before ages alias. Shrink toward 6 for fast-shifting working sets.
# lru-clock-shift 8

###################### KEYSPACE NOTIFICATIONS ######################

# Redis-compatible keyspace notifications [live]. Empty (default) disables all work. Flags:
# K keyspace channels, E keyevent channels; g $ l s h z x e t d classes; m misses; n new keys;
# A aliases g$lshzxetd and deliberately excludes m/n.
# notify-keyspace-events ""

################## CLIENT-SIDE CACHING (CLIENT TRACKING) ##################

# Bound on the per-key "remembering" table CLIENT TRACKING builds in its default (non-BCAST)
# mode [boot-only]: 0 = unlimited, default 1000000, redis knob name and semantics. When the bound is hit a
# random entry is evicted AND its owner is sent an invalidation for that key, so a client can
# never keep serving a value the server has stopped tracking.
#
# The bound is applied PER IO OWNER, because that is where this server keeps the table: a
# connection belongs to exactly one io thread for life, so a per-owner table has a single reader
# and writer and needs no lock on the tracking-armed write path. With T io threads the process
# ceiling is therefore T x this value. BCAST mode keeps no table at all.
#
# Nothing is allocated until a connection actually issues CLIENT TRACKING on, and with no
# tracking client connected the feature costs zero instructions per operation.
# tracking-table-max-keys 1000000

########################### ATOMICS #########################
# Epoch-MVCC cross-shard atomicity, opt-in [both live via CONFIG SET].
# ON: MSET/MSETNX/DEL/UNLINK become all-or-nothing across shards and MGET/EXISTS/TOUCH read one
# committed snapshot (torn-free, group-scoped version entries). OFF (default): zero cost, plain
# paths byte-identical. atomic-window caps in-flight atomic write groups (memory valve; 0=unlimited).
# atomic 0
# -1 = auto (default): min(16 * shards, 1024) — the measured optimum at 8c/32c/64c.
# atomic-window -1

######################### SCRIPTING #########################
# EVAL / EVALSHA / EVAL_RO / EVALSHA_RO, the SCRIPT family, and the FUNCTION library with
# FCALL / FCALL_RO. Nothing here needs enabling: an unused interpreter allocates no Lua state.
#
# Lua VM instructions one activation may retire before it is aborted with BUSY (boot-only,
# rounded up to the 1000-instruction hook interval; 0 = unlimited). A script runs inside ONE
# shard-owner task, so an unbounded loop parks that owner's whole queue — this bound is what
# makes SCRIPT KILL / FUNCTION KILL structurally unnecessary here, and both report NOTBUSY.
# Deliberately not named after Redis's lua-time-limit / busy-reply-threshold: that is a
# wall-clock threshold for STARTING to answer BUSY while a script keeps running, a different
# mechanism, and borrowing the name would borrow the wrong semantics.
# script-instruction-limit 100000

# Cross-owner activations use a private executor workbench and owner-local staged images. These
# four knobs are boot-only. -1 selects the auto value; 0 disables that resource (max-bytes=0 turns
# the cross-owner feature fully off and allocates no workbench or read-intent state).
# Auto staging budget: max(4 MiB, min(maxmemory/shards/16, 64 MiB)); with maxmemory=0, 4 MiB.
# Auto workbench budget: 2x the staging budget. Auto conflict retries: 8. Auto cut slots: 4.
# script-crossshard-max-bytes -1
# script-crossshard-workbench-bytes -1
# script-crossshard-conflict-retries -1
# script-crossshard-cut-slots -1

######################## PERSISTENCE ########################

# Periodic background snapshots [live]. Each repeatable clause is SECONDS CHANGES; a snapshot is
# started once both thresholds have been exceeded/reached since the last successful snapshot.
# `save ""` disables the scheduler and removes mutation-observer work. These are Redis 7.4's
# defaults; CONFIG GET save reports the clauses as one flat space-separated value.
# save 3600 1
# save 300 100
# save 60 10000

# Dump directory and filename (plain filename, no '/') [boot-only].
# dir .
# dbfilename dump.tomo

# Load a dump before serving (boot-only).
# load /path/to/dump.tomo

# File-data and data-sync engine for both AOF and snapshots (boot-only). `uring` is the native
# default; `normal` keeps the blocking write/writev/fdatasync control path for A/B and fallback.
# persist-io uring

# Append-only file [boot-only]. `appendonly yes` records every write into a Redis-style
# multi-part AOF under <dir>/<appenddirname> (manifest + base + incr files; the base is a TomoKV
# snapshot, which is why aof-use-rdb-preamble accepts only yes), and boot replays it before any
# listener opens. Unlike Redis, appendonly cannot be toggled by CONFIG SET: the writer is bound to
# one io thread at boot (and FLIP never converts that thread). Names are plain filenames, no '/'.
# appendonly no
# appenddirname appendonlydir
# appendfilename appendonly.aof

# fsync policy [live]: always (fdatasync per written batch), everysec (default: a background
# fdatasync at most once per second), no (leave it to the kernel).
# appendfsync everysec

# Automatic rewrite [live]: rewrite once the file has grown by this percentage over its size
# after the last rewrite (0 disables the trigger) AND is at least the minimum size.
# auto-aof-rewrite-percentage 100
# auto-aof-rewrite-min-size 64mb

# The AOF base file is a TomoKV snapshot; `no` is rejected at boot and by CONFIG SET.
# aof-use-rdb-preamble yes

# Timestamp annotations inside the AOF [live]; redis knob name and semantics.
# aof-timestamp-enabled no

###################### PROTOCOL / KEYSPACE COMPATIBILITY ######################

# TomoKV owns exactly one keyspace. The Redis-compatible knob is accepted only at its honest value
# 1; any other boot or CONFIG SET value is rejected, and SELECT accepts only database 0.
# databases 1

# Maximum request bulk length [live], default 512 MiB and minimum 1 MiB. Redis accepts values up to
# signed 64-bit, but TomoKV's locked uint32 Slice ABI limits the supported ceiling to 4294901759;
# larger settings are rejected instead of being accepted without enforcement. The receive buffer
# grows only for one incomplete command and sheds that allocation after the command retires.
# proto-max-bulk-len 512mb

#################### COMPACT ENCODINGS ######################
# Small collections live packed inside the key's own block (mdiet); past either limit they
# migrate to the external form. All eight are [live] via CONFIG SET.
# list has no entry cap — its budget is aggregate payload bytes (max-compact-value).

# hash-max-compact-entries 512
# hash-max-compact-value 64
# list-max-compact-entries 4294967295
# list-max-compact-value 8192
# set-max-compact-entries 128
# set-max-compact-value 64
# zset-max-compact-entries 128
# zset-max-compact-value 64

# Stream macro-node rollover budgets [live]. These use Redis's exact knob names: zero disables
# that rollover axis, while the other non-zero axis can still start a new node.
# stream-node-max-bytes 4096
# stream-node-max-entries 100

# (The fork-era --mode/--wb/--nodes flags are gone; use the thread-mode/overlap matrix
# above. An old script passing those removed flags fails loudly as an unknown argument.)

########################## SECURITY #########################

# Password for the default user [live]. Empty/unset disables authentication. AUTH accepts both
# AUTH <password> and AUTH default <password>; HELLO 2 AUTH default <password> authenticates while
# negotiating RESP2. Authentication is latched when a connection opens: enabling or rotating this
# password does not deauthenticate existing connections; RESET recomputes the latch.
# requirepass foobared

# External Redis ACL file [boot-only]. An empty path disables ACL LOAD/SAVE. This is mutually
# exclusive with `user` declarations in this file; ACL SAVE uses temp+fsync+rename+directory-fsync.
# aclfile /etc/tomokv/users.acl

# Inline ACL user definitions [boot-only, repeatable]. Rules follow Redis 7.4 root-selector grammar.
# `%R~`/`%W~`, selectors, and first-argument rules are rejected until their enforcement machinery
# exists; accepting them without enforcement would be a privilege bypass.
# user alice on >secret ~app:* &news.* -@all +@read +set

# Channel permission granted to newly-created/reset users [live]: allchannels | resetchannels.
# Redis 7.4 defaults to resetchannels.
# acl-pubsub-default resetchannels

# Maximum ACL LOG entries retained per IO thread [live]. Zero disables storage.
# acllog-max-len 128

# Refuse non-loopback connections while no password is configured [live]. Accepts 0|1|yes|no and
# CONFIG GET emits the canonical yes/no spelling.
# protected-mode yes

# Protected DEBUG surface (boot-only): no | yes | local. "local" permits loopback and unix-socket
# clients only. The default is no; CONFIG SET rejects this knob as immutable.
# enable-debug-command no

##################### SLOW LOG + LATENCY #####################

# Commands whose execution takes at least this many MICROSECONDS are appended to the slow log.
# -1 disables the log completely; 0 logs every command. Redis knob name, grammar and semantics.
#
# COST. At -1 (and with latency-monitor-threshold 0) the executor pays exactly one predicted-false
# branch per executed BATCH -- not per command -- and reads no clock at all. At the default the
# executor brackets each batch with two clock reads; a batch of one command, which is every command
# on an unpipelined connection, is therefore timed exactly. A pipelined batch that overruns cannot
# be attributed after the fact, so it switches that executor to per-command timing for the next 64
# batches instead, and the recurrence is timed exactly. NOTES-SERVERTAIL.md has the measurements.
#
# Entries record id, timestamp, duration, the command (truncated to 32 arguments and 128 bytes per
# argument, exactly like redis), and the client's address and name. A cross-shard command produces
# ONE entry, attributed to the owner that computed the final answer.
# slowlog-log-slower-than 10000

# How many entries each recording thread retains. 0 keeps none. Shrinking it trims immediately.
# The bound is per recording thread, so SLOWLOG LEN can exceed this on a busy multi-core server.
# slowlog-max-len 128

# Events lasting at least this many MILLISECONDS are sampled by the latency monitor, readable
# through LATENCY LATEST / HISTORY / GRAPH / DOCTOR. 0 disables it and allocates nothing. One event
# class is produced: 'command'. Same arming gate as the slow log, so either knob arms the timing.
# latency-monitor-threshold 0
